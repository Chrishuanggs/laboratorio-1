services:
  postgres:
    image: postgres:16-alpine3.23
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data2

volumes:
  postgres_data:
  redis_data: